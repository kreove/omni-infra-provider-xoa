syntax = "proto3";

package emuspecs;

option go_package = "github.com/kreove/omni-infra-provider-xoa/api/specs";

// MachineSpec is stored in Omni in the infra provisioner state.
message MachineSpec {
  string uuid = 1;
  string schematic = 2;
  string talos_version = 3;
  string template_id = 4;
}
